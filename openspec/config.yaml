schema: spec-driven

context: |
  A change can cover a whole Linear milestone, not one ticket. The first one covers "Architecture Decisions"
  in the project "Post-V0 Roam–Obsidian sync architecture" (ENG-2416). Its Linear tickets already exist, so
  OpenSpec works backwards from them.
  Linear tickets stay the unit of work. Every requirement, scenario and decision cites the tickets it comes
  from, by ID and link.
  A decision the team hasn't made stays open in design.md, with its owner. Don't settle it in the artifact.
  Shared CrossApp contracts and converters live in packages/database; apps/roam and apps/obsidian use them instead of defining their own.

rules:
  proposal:
    - List which of the milestone's decisions are settled and which are still open.
  specs:
    - Each requirement and scenario names its source tickets.
  design:
    - One Decisions entry per open decision in the tickets. Give the question, the answer or "Open, needs <owner>", the options on record with who proposed them and when, and the reason.
    - An answer that departs from a recorded team direction names that direction and says what outweighs it.
  tasks:
    - Don't invent tasks. List each existing Linear ticket with the requirements and decisions it carries, and flag work no ticket covers.

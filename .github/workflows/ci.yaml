name: CI
permissions:
  contents: read
  pull-requests: write
  checks: write
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript Types
        run: npx turbo check-types

      - name: Run Tests
        run: npx turbo run test --filter=roam --ui stream

      - name: Run Package Unit Tests
        run: npx turbo run test:unit --ui stream

  lint-changed-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1

      # Lint only files changed in the PR and annotate results in the PR check.
      - name: Lint Changed Files
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Compute a stable merge-base for the PR diff while keeping fetch depth bounded.
          BASE_SHA=""
          for fetch_depth in 1 10 50 200; do
            git fetch origin "$BASE_REF" --depth="$fetch_depth"
            BASE_SHA="$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA" || true)"
            if [ -n "$BASE_SHA" ]; then
              break
            fi
          done

          if [ -z "$BASE_SHA" ]; then
            echo "Unable to determine merge-base within depth limit (max depth: 200) for base ref '$BASE_REF'."
            echo "Increase the depth sequence in CI for unusually long-lived branches."
            exit 1
          fi

          HEAD_SHA="$PR_HEAD_SHA"

          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No files changed in this pull request."
            exit 0
          fi

          # Keep only lintable files and group them by workspace so each file is linted
          # from the directory that owns its ESLint flat config.
          declare -A workspace_to_files
          lintable_count=0

          for file in "${changed_files[@]}"; do
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs) ;;
              *) continue ;;
            esac

            if [ ! -f "$file" ]; then
              continue
            fi

            IFS='/' read -r top_level workspace_name _ <<< "$file"
            if [ -z "${top_level:-}" ] || [ -z "${workspace_name:-}" ]; then
              continue
            fi

            workspace="${top_level}/${workspace_name}"
            if [ ! -f "${workspace}/eslint.config.mjs" ]; then
              continue
            fi

            relative_file="${file#${workspace}/}"
            if [ "$relative_file" = "$file" ]; then
              continue
            fi

            workspace_to_files["$workspace"]+="${relative_file}"$'\n'
            lintable_count=$((lintable_count + 1))
          done

          if [ "$lintable_count" -eq 0 ]; then
            echo "No changed lintable files in workspaces with ESLint configs."
            exit 0
          fi

          # Run one ESLint config over the changed files and report it as its own check.
          # Capture ESLint output and let reviewdog decide pass/fail after diff filtering.
          # This avoids failing a PR for pre-existing issues elsewhere in touched files.
          run_eslint_lane() {
            local workspace="$1" lane_config="$2" check_name="$3" fail_level="$4"
            shift 4

            local config_args=()
            if [ -n "$lane_config" ]; then
              config_args=(--config "$lane_config")
            fi

            local eslint_output eslint_exit_code=0
            eslint_output="$(mktemp)"
            pnpm --dir "$workspace" exec eslint --no-color --format stylish \
              "${config_args[@]}" "$@" >"$eslint_output" 2>&1 || eslint_exit_code=$?

            # Exit codes of 2 or higher mean ESLint itself failed (bad config, parse crash).
            if [ "$eslint_exit_code" -ge 2 ]; then
              cat "$eslint_output"
              rm -f "$eslint_output"
              return 1
            fi

            local lane_failed=0
            reviewdog \
              -f=eslint \
              -name="$check_name" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -level=warning \
              -fail-level="$fail_level" < "$eslint_output" || lane_failed=1

            rm -f "$eslint_output"
            return $lane_failed
          }

          # Lint every touched workspace and fail once at the end so all findings are reported.
          lint_failed=0
          for workspace in "${!workspace_to_files[@]}"; do
            echo "Linting changed files in ${workspace}"
            mapfile -t files < <(printf '%s' "${workspace_to_files[$workspace]}" | sed '/^$/d')

            # A workspace can split its ESLint setup into two lanes. eslint.config.blocking.mjs
            # holds the rules that gate the merge; eslint.config.advisory.mjs holds rules that
            # are annotated on the PR for visibility but must not block it. Workspaces without
            # these files lint against their default config, unchanged.
            blocking_config=""
            if [ -f "${workspace}/eslint.config.blocking.mjs" ]; then
              blocking_config="eslint.config.blocking.mjs"
            fi

            if ! run_eslint_lane "$workspace" "$blocking_config" \
              "eslint (${workspace})" warning "${files[@]}"; then
              lint_failed=1
            fi

            # Advisory warnings are informational, so only a hard ESLint error fails here.
            if [ -f "${workspace}/eslint.config.advisory.mjs" ]; then
              if ! run_eslint_lane "$workspace" "eslint.config.advisory.mjs" \
                "eslint advisory (${workspace})" error "${files[@]}"; then
                lint_failed=1
              fi
            fi
          done
          exit $lint_failed

  # Guardrail: fail PRs when files touched by the PR are not Prettier-formatted.
  format-changed-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting on changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Compute a stable merge-base for the PR diff while keeping fetch depth bounded.
          BASE_SHA=""
          for fetch_depth in 1 10 50 200; do
            git fetch origin "$BASE_REF" --depth="$fetch_depth"
            BASE_SHA="$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA" || true)"
            if [ -n "$BASE_SHA" ]; then
              break
            fi
          done

          if [ -z "$BASE_SHA" ]; then
            echo "Unable to determine merge-base within depth limit (max depth: 200) for base ref '$BASE_REF'."
            echo "Increase the depth sequence in CI for unusually long-lived branches."
            exit 1
          fi

          HEAD_SHA="$PR_HEAD_SHA"
          # Scope checks to files introduced or modified by the PR.
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No files changed in this pull request."
            exit 0
          fi

          # Skip paths removed in the PR (deleted files cannot be formatted).
          mapfile -t existing_changed_files < <(
            for file in "${changed_files[@]}"; do
              if [ -f "$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )

          if [ ${#existing_changed_files[@]} -eq 0 ]; then
            echo "No changed files exist in the checkout."
            exit 0
          fi

          format_failed=0
          # Chunk file lists to avoid command-line length limits on very large PRs.
          chunk_size=100

          for ((i=0; i<${#existing_changed_files[@]}; i+=chunk_size)); do
            chunk=( "${existing_changed_files[@]:i:chunk_size}" )
            # --ignore-unknown lets us pass all changed files safely; Prettier only checks supported types.
            if ! pnpm exec prettier --check --ignore-unknown "${chunk[@]}"; then
              format_failed=1
            fi
          done

          # Exit non-zero if any chunk had formatting violations.
          exit $format_failed

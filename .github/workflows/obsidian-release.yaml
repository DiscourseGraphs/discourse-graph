name: Stable Obsidian Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release, e.g. 1.6.0. Must match an existing Linear release version."
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  OBSIDIAN_PLUGIN_REPO_TOKEN: ${{ secrets.OBSIDIAN_PLUGIN_REPO_TOKEN }}
  # Inlined into the bundle at build time by scripts/compile.ts. Without it the
  # plugin falls back to a dev URL, so released builds call localhost.
  NEXT_API_ROOT: https://discoursegraphs.com/api
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected semver like 1.6.0."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish stable release
        run: cd apps/obsidian && npx tsx scripts/publish.ts --version "$VERSION"

      # There is deliberately no version-bump commit here. The default-branch
      # ruleset requires a pull request and grants github-actions[bot] no bypass,
      # so a push from CI is always rejected on main. Bump apps/obsidian/
      # manifest.json and package.json in the release PR before dispatching.

      - name: Sync Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_RELEASES_ACCESS_KEY_OBSIDIAN }}
          command: sync
          version: ${{ env.VERSION }}
          include_paths: "apps/obsidian/**,packages/database/**,packages/utils/**"

      - name: Complete Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_RELEASES_ACCESS_KEY_OBSIDIAN }}
          command: complete
          version: ${{ env.VERSION }}

      # The incoming webhook is bound to its Slack channel when it is created,
      # so changing the destination channel means replacing this secret.
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_OBSIDIAN_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_OBSIDIAN_RELEASE_WEBHOOK_URL is not set; skipping Slack notification."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg text "Discourse Graph for Obsidian ${VERSION} was released. <${RUN_URL}|Workflow run>" \
            '{text: $text}' \
            | curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

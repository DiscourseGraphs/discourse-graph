name: Database tests
on:
  pull_request:
    paths:
      - "packages/database/**"
env:
  SUPABASE_USE_DB: local
  SUPABASE_PROJECT_ID: test
  GITHUB_TEST: test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # - name: Get supabase version
      #   working-directory: ./packages/database
      #   run: echo "SUPABASE_VERSION=$(./node_modules/.bin/supabase --version)" >> $GITHUB_ENV
      # - name: Cache Docker images.
      #   uses: AndreKurait/docker-cache@0.6.0
      #   with:
      #     key: docker-${{ runner.os }}-${{ env.SUPABASE_VERSION }}
      # lintSchemas.ts passes silently when sqruff is missing, so install it
      # here; keep the version in step with the one developers run locally.
      - name: Install sqruff
        run: pipx install sqruff==0.44.0
      - name: Check schema files against migrations
        working-directory: ./packages/database
        run: pnpm run check-schema
      - name: Setup database
        working-directory: ./packages/database
        run: pnpm run setup
      - name: Serve and run tests
        working-directory: ./packages/database
        run: pnpm run test:withserve

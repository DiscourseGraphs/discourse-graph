name: Main - Obsidian Beta Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/obsidian/**"
      - "packages/database/**"
      - "packages/utils/**"

permissions:
  contents: write

env:
  OBSIDIAN_PLUGIN_REPO_TOKEN: ${{ secrets.OBSIDIAN_PLUGIN_REPO_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute next beta version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./apps/obsidian/package.json').version")
          if [[ "$CURRENT_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            N="${BASH_REMATCH[2]}"
            NEXT_BETA="${BASE}-beta.$((N + 1))"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_BETA="${MAJOR}.${MINOR}.$((PATCH + 1))-beta.1"
          fi
          echo "Current version: $CURRENT_VERSION -> next beta: $NEXT_BETA"
          echo "version=$NEXT_BETA" >> "$GITHUB_OUTPUT"

      - name: Publish beta release
        run: cd apps/obsidian && npx tsx scripts/publish.ts --version ${{ steps.version.outputs.version }}

      - name: Commit version bump
        run: |
          if ! git diff --quiet -- apps/obsidian/package.json apps/obsidian/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/obsidian/package.json apps/obsidian/manifest.json
            git commit -m "chore: bump obsidian version to ${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Sync Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_RELEASES_ACCESS_KEY }}
          include_paths: "apps/obsidian/**,packages/database/**,packages/utils/**"
